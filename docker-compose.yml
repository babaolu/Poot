version: "3.8"

services:
  orchestrator:
    build: ./services/orchestrator
    ports:
      - "3000:8080"
    volumes:
      - ./services/orchestrator:/app
      - /app/node_modules
      - /app/build-native
    environment:
      - NODE_ENV=development
      - DATABASE_URL=host=postgres user=cloudmine password=cloudmine dbname=cloudmine
    command: /app/build-native/orchestrator-server
    depends_on:
      - postgres

  customer-dashboard:
    build: ./apps/customer-dashboard
    ports:
      - "3002:3000"
    volumes:
      - ./apps/customer-dashboard:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cloudmine
      POSTGRES_PASSWORD: cloudmine
      POSTGRES_DB: cloudmine
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
